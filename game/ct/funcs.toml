# Menu/overlay system entry. Runs a cooperative task scheduler that switches
# S per task (TCS at $C281FA) and resumes tasks via JMP ($0000) at $C28203;
# not expressible as nested C calls yet. v0 boundary: hook is fatal, so code
# after calls to it is not translated.
[[extern]]
name = "MenuOverlay_Launch"
addr = 0xC28000
kind = "JSL"
hook = "menu_overlay"
noreturn = true

# The menu thread yields: in the frame scheduler the real code runs (the
# scheduler resumes the caller with its P restored, so exit M/X equals
# entry M/X); in the diff harness the hook stands in and faults, since a
# randomized scheduler round-trip has no deterministic meaning there.
# They stay [[boundary]] entries too: never function entries, and the
# three JMP (tail) callers stop there via the interpreter hand-off.
[[extern]]
name = "Menu_Yield"
addr = 0xC2821E
kind = "JSR"
hook = "menu_yield"

# Soft reset (ChronoRET bank00 Reset): Pad_ReadAndDecode JMLs here when
# JOY1 reads $3030 (L+R+Select+Start); the game restarts through MainInit
# and never returns to the pad reader. In the frame scheduler the real
# code runs interpreted; the hook stands in only for the diff harness.
[[extern]]
