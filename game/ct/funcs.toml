# ---- field NMI/IRQ handlers (#14): reached by jumps, not calls ----
# NMI/IRQ vector -> $FF10 / $FF14 (JML $000500 / $000504) -> the JML that
# Field_InstallNmiVector / Field_InstallIrqVector put there. Neither JML
# changes M/X, so the states are those observed at $00FF10 / $00FF14
# (ct_boot --profile, boot and the two replays); the title's own handlers
# share those vectors, so some states may be unused here (dispatch still
# matches M/X exactly).

