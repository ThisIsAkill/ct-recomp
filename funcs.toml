# ---- Engine roots ----

# Reset ($C0FF00) does SEI/CLC/XCE and JML here: native, M=1 X=1
# (ChronoRET bankFD.asm "On entry"). Tail-jumps (JML) to GameLoop $C0000E.
[[func]]
name = "MainInit"
addr = 0xFDC000
states = ["m1x1"]
e = 0
module = "bankfd"

# ---- call boundaries, continued ----

# Self-modifying RAM stub: callers store "MVN $7E,bank ; RTL" at $7E9690-$9693
# (e.g. $C28635-$C2863E) and JSL to it. The hook checks those bytes at run
# time and executes them; exit M/X = entry M/X.
[[extern]]
name = "Wram_MvnStub"
addr = 0x7E9690
kind = "JSL"
hook = "wram_mvn_stub"

# Boot program decompressed from ROM into WRAM, entered by JML at $C30073.
[[extern]]
name = "Wram_BootProgram"
addr = 0x7E3000
kind = "JML"
hook = "wram_boot_program"
noreturn = true

